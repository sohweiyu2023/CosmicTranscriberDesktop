name: Real-input Windows UI acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cosmic-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build app and harness
        run: |
          dotnet build src/CosmicTranscriber/CosmicTranscriber.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/UiAcceptance/UiAcceptance.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real mouse and keyboard journeys on a disposable runner profile
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src/CosmicTranscriber/bin/Release/net10.0-windows/CosmicTranscriber.exe'
          $evidence = Join-Path $env:RUNNER_TEMP 'ui-evidence'
          dotnet tests/UiAcceptance/bin/Release/net10.0-windows/UiAcceptance.dll --exe $exe --evidence $evidence --print-shots
          if ($LASTEXITCODE -ne 0) { throw "UI acceptance failed ($LASTEXITCODE)" }
      - name: Keep synthetic screenshots and app logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-acceptance-evidence
          path: ${{ runner.temp }}/ui-evidence
          retention-days: 14
# Synthetic input only: no API key, no provider request, no user data. The runner profile is discarded.
